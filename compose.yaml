name: grupo-visa-ai

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/ocd.sqlite3
      KNOWLEDGE_DIR: /app/knowledge
      FRONTEND_DIR: /app/static
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      ATLASSIAN_BASE_URL: ${ATLASSIAN_BASE_URL:-https://grupo-visai.atlassian.net}
      ATLASSIAN_EMAIL: ${ATLASSIAN_EMAIL:-}
      ATLASSIAN_API_TOKEN: ${ATLASSIAN_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-SCRUM}
    volumes:
      - sqlite_data:/data
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  tests:
    profiles: [test]
    build:
      context: .
      target: tests
    environment:
      KNOWLEDGE_DIR: /app/knowledge

volumes:
  sqlite_data:
