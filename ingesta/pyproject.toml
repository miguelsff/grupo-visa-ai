[project]
name = "grupo-visa-ai-ingesta"
version = "0.1.0"
description = "Ingesta remota y publicación atómica del conocimiento OCD"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "openai>=2,<4",
    "pydantic>=2.10,<3",
    "beautifulsoup4>=4.14,<5",
]

[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ocd_ingesta*"]

[project.scripts]
ocd-ingestar = "ocd_ingesta.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "jsonschema>=4.25,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
