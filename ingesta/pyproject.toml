[project]
name = "grupo-visa-ai-ingesta"
version = "0.1.0"
description = "Ingesta documental OCD independiente (implementación pendiente en T2)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "openai>=2,<4",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
